{% extends "main/layout.html" %}

{% block content %}
    <h2>Вход на сайт</h2>
    
    {% if form.errors %}
        <p style="color: red;">Неверное имя пользователя или пароль. Попробуйте снова.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <p>
            <label for="id_username">Имя пользователя:</label><br>
            {{ form.username }}
        </p>
        <p>
            <label for="id_password">Пароль:</label><br>
            {{ form.password }}
        </p>
        <button type="submit">Войти</button>
    </form>
{% endblock %}
